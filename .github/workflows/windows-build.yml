name: Windows desktop distribution

on:
  push:
    branches:
      - 'build/windows-x64-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  OPENAI_API_KEY: ''
  DEEPSEEK_API_KEY: ''
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out isolated build snapshot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          architecture: x64

      - name: Verify source manifest
        run: |
          @'
          from pathlib import Path
          import hashlib
          import json
          manifest = json.loads(Path('build-source-manifest.json').read_text(encoding='utf-8'))
          for item in manifest['files']:
              path = Path(item['path'])
              assert not path.is_absolute() and '..' not in path.parts
              data = path.read_bytes()
              assert len(data) == item['bytes'], item['path']
              assert hashlib.sha256(data).hexdigest() == item['sha256'], item['path']
          print('Verified source manifest:', len(manifest['files']), 'files')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.5.9
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv sync --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Python regressions
        run: uv run python -m unittest discover -s tests -v

      - name: Run desktop unit tests
        run: npm test

      - name: Build native Windows backend and NSIS installer
        run: npm run dist -- --win --x64 --publish never --config.nsis.runAfterFinish=false

      - name: Check bundled runtime and configuration exclusion
        run: |
          $bundle = Join-Path $PWD 'dist/desktop/win-unpacked'
          if (-not (Test-Path "$bundle/resources/backend/mini-six-ren-backend.exe")) {
            throw 'The Windows Python backend was not bundled.'
          }
          $forbidden = @(Get-ChildItem $bundle -Recurse -Force -File | Where-Object { $_.Name -like '.env*' })
          if ($forbidden.Count -ne 0) { throw 'A configuration file was bundled unexpectedly.' }
          node -e "const a=require('@electron/asar');const p=a.listPackage('dist/desktop/win-unpacked/resources/app.asar');if(p.some(f=>/(^|[\\/])\.env([.\\/]|$)/.test(f)))throw Error('Unexpected bundled config');console.log('Bundled runtime / config exclusion: OK');"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke-test unpacked application
        run: |
          $executable = Join-Path $PWD 'dist/desktop/win-unpacked/小六壬.exe'
          npm run test:smoke -- --packaged $executable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install NSIS package and test installed application
        run: |
          $installers = @(Get-ChildItem 'dist/desktop/mini-six-ren-*-win-x64.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one Windows installer.' }
          $installDir = Join-Path $env:RUNNER_TEMP 'mini-six-ren-installed'
          $process = Start-Process -FilePath $installers[0].FullName -ArgumentList '/S', "/D=$installDir" -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Installer exited with $($process.ExitCode)." }
          $executable = Join-Path $installDir '小六壬.exe'
          if (-not (Test-Path $executable)) { throw 'Installed application executable was not found.' }
          npm run test:smoke -- --packaged $executable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate checksums and build identity
        run: |
          $checksums = Get-ChildItem 'dist/desktop/mini-six-ren-*-win-x64.exe' | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $checksums | Set-Content 'dist/desktop/SHA256SUMS-windows.txt' -Encoding utf8
          $nodeVersion = node --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pythonVersion = python --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $uvVersion = uv --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $info = [ordered]@{
            source_commit = '${{ github.sha }}'
            run_url = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            platform = 'windows-x64'
            runner = 'windows-2022'
            node = $nodeVersion
            python = $pythonVersion
            uv = $uvVersion
            built_at_utc = (Get-Date).ToUniversalTime().ToString('o')
            tests = @('Python regressions', 'Node unit tests', 'source manifest', 'unpacked Electron smoke', 'NSIS install', 'installed Electron smoke', 'normal window close / backend exit / port release')
            signed = $false
          }
          $info | ConvertTo-Json -Depth 4 | Set-Content 'dist/desktop/BUILD-INFO-windows.json' -Encoding utf8

      - name: Upload validated installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mini-six-ren-windows-x64
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
          path: |
            dist/desktop/mini-six-ren-*-win-x64.exe
            dist/desktop/SHA256SUMS-windows.txt
            dist/desktop/BUILD-INFO-windows.json
            build-source-manifest.json

      - name: Collect smoke screenshots
        if: always()
        run: |
          New-Item -ItemType Directory -Force 'build/validation-screenshots' | Out-Null
          Get-ChildItem $env:TEMP -Directory -Filter 'mini-six-ren-smoke-*' -ErrorAction SilentlyContinue | ForEach-Object {
            $name = $_.Name
            Get-ChildItem $_.FullName -File -Filter '*.png' | ForEach-Object {
              Copy-Item $_.FullName "build/validation-screenshots/$name-$($_.Name)"
            }
          }

      - name: Upload screenshots only, never test configuration
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-validation-screenshots
          retention-days: 7
          if-no-files-found: ignore
          path: build/validation-screenshots/*.png
